name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --------------------------------------------------- PR : lint + unitaires
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Tests + couverture (seuil 70 %)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: sentinel
          POSTGRES_DB: sentinel_test
          POSTGRES_PASSWORD: sentinel
          REDIS_HOST: localhost
        run: pytest
      # Paquets critiques (risque, execution) : 90 %, liste dans pyproject.toml.
      - name: Couverture des paquets critiques (seuil 90 %)
        run: python ../scripts/ci/critical_coverage.py
      - name: Scripts CI (ruff, format, mypy ; config du backend)
        run: |
          ruff check --config pyproject.toml ../scripts
          ruff format --check --config pyproject.toml ../scripts
          mypy ../scripts
      # Meta-test de scripts/verifier.sh : un test rouge doit le faire echouer.
      - name: Meta-test de verifier.sh (test rouge)
        env:
          VERIFIER_NATIVE: "1"
        run: ../scripts/verifier-autotest.sh backend

  ml:
    name: ML — lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: ml }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Tests + couverture (seuil dans pyproject.toml)
        run: pytest

  frontend:
    name: Frontend — lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test

  # --------------------------------------------- commits de la PR (commitlint)
  # Meme script qu'en local (scripts/verifier.sh commits) : ce que la CI verifie,
  # chacun peut le verifier avant de pousser. Le titre de la PR, qui devient le
  # commit du squash merge, a son propre workflow (pr-titre.yml), relance a
  # chaque renommage.
  commits:
    name: Commits — Conventional Commits, scope obligatoire
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - run: >-
          npm install --no-save --no-package-lock --no-audit --no-fund
          @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1
      # Meta-test : un message hors convention doit faire echouer verifier.sh.
      - run: scripts/verifier-autotest.sh message
        env:
          VERIFIER_NATIVE: "1"
      - name: Chaque commit de la PR
        env:
          VERIFIER_NATIVE: "1"
          VERIFIER_BASE: ${{ github.event.pull_request.base.sha }}
          VERIFIER_HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/verifier.sh commits

  # ------------------------------------------------------- securite (PR)
  security:
    name: Securite — secrets, deps, code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # Binaire officiel (licence MIT) plutot que gitleaks-action, qui n'est plus
      # sous MIT et exige une cle de licence pour un depot d'organisation.
      # Analyse volontairement tout l'historique recupere, toutes branches
      # comprises : un secret pousse n'importe ou dans un depot public est un
      # incident, meme hors de la PR.
      - name: Gitleaks — aucun secret dans l'historique
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --exit-code 1 .
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11" }
      - run: pip install bandit pip-audit
      # Tout le Python suivi par git, hors tests : un nouveau service est
      # analyse sans qu'il faille l'ajouter a une liste.
      - name: Bandit
        run: git ls-files -z '*.py' ':!:**/tests/**' | xargs -0 bandit -ll
      # Chaque fichier Python doit relever d'un job qui le lint et le type :
      # un nouveau dossier fait echouer la CI tant qu'il n'est pas rattache.
      - name: Aucun Python hors des perimetres lintes
        run: |
          outside=$(git ls-files '*.py' | grep -vE '^(backend|ml|scripts)/' || true)
          if [ -n "$outside" ]; then
            echo "::error::Python hors de backend/, ml/ et scripts/ : a rattacher a un job de lint"
            echo "$outside"
            exit 1
          fi
      # Dependances runtime declarees (celles des images prod), resolues a la
      # derniere version admise. Bloquant. pip et setuptools n'y figurent pas :
      # ils sont retires des images prod. torch (non declare) : voir ECARTS, E6.
      - name: pip-audit (dependances runtime)
        run: |
          status=0
          for svc in backend ml; do
            req="$RUNNER_TEMP/requirements-$svc.txt"
            python -c "import sys, tomllib; print('\\n'.join(tomllib.load(open(sys.argv[1], 'rb'))['project']['dependencies']))" \
              "$svc/pyproject.toml" > "$req"
            echo "== $svc"
            pip-audit -r "$req" || status=1
          done
          exit "$status"

  # ------------------------------ inventaire derive de la configuration
  # Les images a construire, les images tierces et les ports publies viennent
  # de `docker compose config` sur chaque fichier compose suivi par git : aucune
  # liste tenue a la main, un service ajoute est controle d'office.
  inventaire:
    name: Inventaire — images et ports (derives de la compose)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.inv.outputs.images }}
      third_party: ${{ steps.inv.outputs.third_party }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ports publies sur 127.0.0.1 uniquement ; listes d'images
        id: inv
        run: python3 scripts/ci/compose_inventory.py --github-output "$GITHUB_OUTPUT"

  # ------------------------------------------- build + scan de nos images
  build:
    name: Build et scan — ${{ matrix.name }}
    needs: [inventaire, backend, ml, frontend, security]
    if: needs.inventaire.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.inventaire.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: sentinel-${{ matrix.name }}:ci
          # Etape qui applique des correctifs systeme (apk upgrade) : toujours
          # reconstruite, sinon le cache fige le correctif du premier build.
          no-cache-filters: ${{ matrix.no_cache }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy — vulnerabilites de l'image
        # Epingle par SHA : les tags d'origine (dont 0.28.0) ont ete reecrits vers
        # du code malveillant en mars 2026 (GHSA-69fq-xp46-6x23), puis supprimes.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0   # binaire fige ; v0.69.4 a v0.69.6 etaient compromises
          image-ref: sentinel-${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ------------------------------------ images tierces : rapport, voir ECARTS
  # Images utilisees telles quelles (base, redis, stack cloud). Non bloquant tant
  # que les ecarts connus ne sont pas traites (docs/ECARTS.md) : le resultat part
  # dans le resume du run, l'etape apparait en echec sans faire echouer la CI.
  images-tierces:
    name: Images tierces — ${{ matrix.image }}
    needs: [inventaire]
    if: needs.inventaire.outputs.third_party != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.inventaire.outputs.third_party) }}
    steps:
      - name: Trivy — ${{ matrix.image }}
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          output: trivy.txt
      - name: Resume du run
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
          USED_BY: ${{ matrix.used_by }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$OUTCOME" = failure ]; then
            echo "::warning title=Image tierce::$IMAGE : HIGH/CRITICAL corrigeables ou scan impossible (docs/ECARTS.md)"
          fi
          {
            echo "### $IMAGE"
            echo "Utilisee par : $USED_BY"
            echo '```'
            cat trivy.txt 2>/dev/null || echo "scan impossible (image introuvable ?)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------- demarrage de la stack complete
  compose:
    name: Smoke — la stack demarre
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparer le .env
        run: |
          cp .env.example .env
          for v in POSTGRES_PASSWORD APP_DB_PASSWORD REDIS_PASSWORD API_SECRET_KEY; do
            sed -i "s/^$v=.*/$v=$(openssl rand -hex 32)/" .env
          done
      # La compose de base ne publie aucun port (seul le proxy, sur 127.0.0.1) :
      # les sondes passent par docker compose exec, depuis les conteneurs.
      # --wait attend chaque healthcheck : db (TCP, apres l'init), redis, api, ml,
      # worker (ping Celery via le broker), frontend et proxy (nginx non-root).
      # Aucune sonde ne part avant. Ce sont les images PROD qui demarrent ici.
      - name: Demarrer et attendre les healthchecks
        run: docker compose up -d --build --wait --wait-timeout 300
      # Role applicatif (env.py refuse le superutilisateur), image prod.
      - name: Migrations Alembic
        run: docker compose exec -T api alembic upgrade head
      - name: API prete (base et ML joignables)
        run: |
          docker compose exec -T api python -c "
          import json, urllib.request
          r = json.load(urllib.request.urlopen('http://localhost:8000/health/ready', timeout=10))
          print(r)
          raise SystemExit(r['status'] != 'ok')
          "
      # Images prod sans pip ni setuptools : chaque dependance runtime declaree
      # (liste derivee du pyproject.toml) doit s'importer, pas seulement le code
      # que les healthchecks touchent.
      - name: Dependances runtime importables (images prod)
        run: |
          for svc in api worker ml; do
            echo "== $svc"
            docker compose exec -T "$svc" python - < scripts/ci/import_runtime_deps.py
          done
      - name: Proxy -> frontend et API (seul port publie, 127.0.0.1:8080)
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/api/health/ready | python3 -c "
          import json, sys
          r = json.load(sys.stdin)
          print(r)
          raise SystemExit(r['status'] != 'ok')
          "
      # Regle : metriques scrapees en interne, jamais publiees par le proxy.
      - name: Metriques internes, invisibles depuis le proxy
        run: |
          for path in /api/metrics /api/metrics/ /api//metrics /api/%6detrics; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$path")
            echo "$path -> $code"
            test "$code" = 404
          done
          docker compose exec -T api python -c "
          import urllib.request
          body = urllib.request.urlopen('http://localhost:8000/metrics', timeout=10).read()
          raise SystemExit(b'http_requests_total' not in body)
          "
      - name: Journaux en cas d'echec
        if: failure()
        run: docker compose logs --no-color
      - name: Arreter
        if: always()
        run: docker compose down -v --remove-orphans
