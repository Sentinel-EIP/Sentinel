name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --------------------------------------------------- PR : lint + unitaires
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Tests + couverture (seuil 70 %)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: sentinel_test
          POSTGRES_PASSWORD: sentinel
          REDIS_HOST: localhost
        run: pytest

  ml:
    name: ML — lint et tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ml }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  frontend:
    name: Frontend — lint et tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test

  # ------------------------------------------------------- securite (PR)
  security:
    name: Securite — secrets, deps, code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # Binaire officiel (licence MIT) plutot que gitleaks-action, qui n'est plus
      # sous MIT et exige une cle de licence pour un depot d'organisation.
      # Analyse volontairement tout l'historique recupere, toutes branches
      # comprises : un secret pousse n'importe ou dans un depot public est un
      # incident, meme hors de la PR.
      - name: Gitleaks — aucun secret dans l'historique
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --exit-code 1 .
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11" }
      - run: pip install bandit pip-audit
      - name: Bandit
        run: bandit -r backend/app ml/app -ll
      - name: pip-audit
        run: pip-audit -r <(pip install -q pip-tools && echo) || true

  # ----------------------------------------- merge develop : build + scan
  build:
    name: Build des images
    if: github.event_name == 'push'
    needs: [backend, ml, frontend, security]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # check : l'image prod demarre-t-elle ? Le dev et la CI ont setuptools,
          # la prod non : une dependance qui en aurait besoin ne casserait qu'ici.
          # no_cache : etapes a toujours reconstruire (apk upgrade des correctifs).
          - { name: backend,  file: infra/docker/Dockerfile.backend,  check: "python -c 'import app.main, app.worker'" }
          - { name: ml,       file: infra/docker/Dockerfile.ml,       check: "python -c 'import app.main, torch, sklearn, transformers'" }
          - { name: frontend, file: infra/docker/Dockerfile.frontend, check: "nginx -t", no_cache: prod }
          - { name: proxy,    file: infra/docker/Dockerfile.proxy,    check: "nginx -t", no_cache: prod }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: prod
          push: false
          load: true
          tags: sentinel-${{ matrix.name }}:ci
          no-cache-filters: ${{ matrix.no_cache }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Image prod utilisable
        # --add-host : nginx -t resout les amonts du proxy (api, frontend).
        run: >-
          docker run --rm --add-host api:127.0.0.1 --add-host frontend:127.0.0.1
          --entrypoint sh sentinel-${{ matrix.name }}:ci -c "${{ matrix.check }}"
      - name: Trivy — vulnerabilites de l'image
        # Epingle par SHA : les tags d'origine (dont 0.28.0) ont ete reecrits vers
        # du code malveillant en mars 2026 (GHSA-69fq-xp46-6x23), puis supprimes.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0   # binaire fige ; v0.69.4 a v0.69.6 etaient compromises
          image-ref: sentinel-${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ----------------------------------- demarrage de la stack complete
  compose:
    name: Smoke — la stack demarre
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparer le .env
        run: |
          cp .env.example .env
          for v in POSTGRES_PASSWORD APP_DB_PASSWORD REDIS_PASSWORD API_SECRET_KEY; do
            sed -i "s/^$v=.*/$v=$(openssl rand -hex 32)/" .env
          done
      # La compose de base ne publie aucun port (seul le proxy, sur 127.0.0.1) :
      # les sondes passent par docker compose exec, depuis les conteneurs.
      # --wait attend chaque healthcheck : db (TCP, apres l'init), redis, api, ml,
      # worker (ping Celery via le broker), frontend et proxy (nginx non-root).
      # Aucune sonde ne part avant.
      - name: Demarrer et attendre les healthchecks
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: API prete (base et ML joignables)
        run: |
          docker compose exec -T api python -c "
          import json, urllib.request
          r = json.load(urllib.request.urlopen('http://localhost:8000/health/ready', timeout=10))
          print(r)
          raise SystemExit(r['status'] != 'ok')
          "
      - name: Proxy -> frontend et API (seul port publie, 127.0.0.1:8080)
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/api/health/ready | python3 -c "
          import json, sys
          r = json.load(sys.stdin)
          print(r)
          raise SystemExit(r['status'] != 'ok')
          "
      - name: Journaux en cas d'echec
        if: failure()
        run: docker compose logs --no-color
      - name: Arreter
        if: always()
        run: docker compose down -v --remove-orphans
