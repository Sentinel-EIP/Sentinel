name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --------------------------------------------------- PR : lint + unitaires
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Tests + couverture (seuil 70 %)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: sentinel_test
          POSTGRES_PASSWORD: sentinel
          REDIS_HOST: localhost
        run: pytest

  ml:
    name: ML — lint et tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ml }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  frontend:
    name: Frontend — lint et tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test

  # ------------------------------------------------------- securite (PR)
  security:
    name: Securite — secrets, deps, code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks — aucun secret dans le depot
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install bandit pip-audit
      - name: Bandit
        run: bandit -r backend/app ml/app -ll
      - name: pip-audit
        run: pip-audit -r <(pip install -q pip-tools && echo) || true

  # ----------------------------------------- merge develop : build + scan
  build:
    name: Build des images
    if: github.event_name == 'push'
    needs: [backend, ml, frontend, security]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend,  file: infra/docker/Dockerfile.backend }
          - { name: ml,       file: infra/docker/Dockerfile.ml }
          - { name: frontend, file: infra/docker/Dockerfile.frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: prod
          push: false
          load: true
          tags: sentinel-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy — vulnerabilites de l'image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sentinel-${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ----------------------------------- demarrage de la stack complete
  compose:
    name: Smoke — la stack demarre
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparer le .env
        run: |
          cp .env.example .env
          for v in POSTGRES_PASSWORD APP_DB_PASSWORD REDIS_PASSWORD API_SECRET_KEY; do
            sed -i "s/^$v=.*/$v=$(openssl rand -hex 32)/" .env
          done
      - name: Demarrer
        run: docker compose up -d --build db redis api ml
      - name: Attendre les health checks
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health >/dev/null 2>&1; then exit 0; fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Arreter
        if: always()
        run: docker compose down -v
