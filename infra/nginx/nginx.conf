server {
    listen 8080;              # nginx non-root : pas de port < 1024
    server_name _;

    # DNS interne de Docker, interroge a chaque requete (cache 10 s) : un
    # conteneur recree avec une autre IP reste joignable sans redemarrer le proxy.
    # Il faut pour cela un proxy_pass qui passe par une variable.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $frontend_upstream http://frontend:8080;

    # Metriques : scrape interne uniquement (api:8000/metrics), jamais via le proxy.
    # Regex (prioritaire sur /api/) : couvre aussi /api/metrics/ et /api//metrics.
    location ~ ^/api/+metrics(/|$) {
        return 404;
    }

    location /api/ {
        # Avec une variable, proxy_pass ne retire plus le prefixe : rewrite le fait.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket : flux temps reel du dashboard
    location /ws {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass $frontend_upstream;
    }
}
