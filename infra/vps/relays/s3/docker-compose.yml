# Relais s3 — Garage (API S3). A deployer sur le VPS dans ~/docker/s3-relay/.
# Variables : infra/vps/relays/.env.example, a copier en ~/docker/relays.env.
#   docker compose --env-file ~/docker/relays.env up -d
services:
  s3-relay:
    image: alpine/socat:1.8.1.3
    container_name: s3-relay
    restart: unless-stopped
    command: TCP-LISTEN:3003,fork,reuseaddr TCP:${GATEWAY_TUNNEL_ADDRESS:?GATEWAY_TUNNEL_ADDRESS manquant}:3003
    networks: [web]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:?TRAEFIK_NETWORK manquant}"
      traefik.http.routers.s3.rule: "Host(`${S3_DOMAIN:?S3_DOMAIN manquant}`)"
      traefik.http.routers.s3.entrypoints: "websecure"
      traefik.http.routers.s3.tls.certresolver: "${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER manquant}"
      traefik.http.services.s3.loadbalancer.server.port: "3003"
    mem_limit: 64m
    cpus: 0.25

networks:
  web:
    name: ${TRAEFIK_NETWORK:?TRAEFIK_NETWORK manquant}
    external: true
