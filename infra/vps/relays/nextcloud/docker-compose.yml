# Relais nextcloud — Nextcloud. A deployer sur le VPS dans ~/docker/nextcloud-relay/.
# Variables : infra/vps/relays/.env.example, a copier en ~/docker/relays.env.
#   docker compose --env-file ~/docker/relays.env up -d
services:
  nextcloud-relay:
    image: alpine/socat:1.8.1.3
    container_name: nextcloud-relay
    restart: unless-stopped
    command: TCP-LISTEN:3002,fork,reuseaddr TCP:${GATEWAY_TUNNEL_ADDRESS:?GATEWAY_TUNNEL_ADDRESS manquant}:3002
    networks: [web]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:?TRAEFIK_NETWORK manquant}"
      traefik.http.routers.cloud.rule: "Host(`${NC_DOMAIN:?NC_DOMAIN manquant}`)"
      traefik.http.routers.cloud.entrypoints: "websecure"
      traefik.http.routers.cloud.tls.certresolver: "${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER manquant}"
      traefik.http.services.cloud.loadbalancer.server.port: "3002"
      # En-tetes indispensables derriere un reverse proxy
      traefik.http.middlewares.cloud-headers.headers.customrequestheaders.X-Forwarded-Proto: "https"
      traefik.http.routers.cloud.middlewares: "cloud-headers"
    mem_limit: 64m
    cpus: 0.25

networks:
  web:
    name: ${TRAEFIK_NETWORK:?TRAEFIK_NETWORK manquant}
    external: true
