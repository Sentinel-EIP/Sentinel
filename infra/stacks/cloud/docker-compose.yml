# Services d'equipe Sentinel — partage de fichiers et stockage objet.
# Tourne sur le poste fixe (WSL2), expose via la gateway WireGuard
# (voir infra/stacks/gateway/README.md), elle-meme relayee par le Traefik du VPS.
# Seuls Nextcloud et l'API S3 sont relayes ; la console MinIO reste locale.
#
#   docker compose --env-file .env up -d

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:

  # =============================================================== Nextcloud
  nextcloud:
    image: nextcloud:30-apache
    container_name: cloud-nextcloud
    restart: unless-stopped
    depends_on:
      nextcloud-db:   { condition: service_healthy }
      nextcloud-redis: { condition: service_healthy }
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${NC_DB_NAME:?NC_DB_NAME manquant}
      POSTGRES_USER: ${NC_DB_USER:?NC_DB_USER manquant}
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD:?NC_DB_PASSWORD manquant}
      REDIS_HOST: nextcloud-redis
      REDIS_HOST_PASSWORD: ${NC_REDIS_PASSWORD:?NC_REDIS_PASSWORD manquant}
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:?NC_ADMIN_USER manquant}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:?NC_ADMIN_PASSWORD manquant}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NC_DOMAIN:?NC_DOMAIN manquant}
      # Traefik (VPS) termine le TLS ; la gateway relaie en HTTP.
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://${NC_DOMAIN:?NC_DOMAIN manquant}
      # Le conteneur ne voit que l'IP du relais : on lui dit de lui faire confiance.
      TRUSTED_PROXIES: 172.16.0.0/12
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 4G
    volumes:
      - nextcloud-html:/var/www/html          # code + config + apps
      - nextcloud-data:/var/www/html/data     # fichiers des utilisateurs
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks: [cloud, edge]
    mem_limit: 3g
    cpus: 2.0
    logging: *logging

  nextcloud-db:
    image: postgres:16-alpine
    container_name: cloud-nextcloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NC_DB_NAME:?NC_DB_NAME manquant}
      POSTGRES_USER: ${NC_DB_USER:?NC_DB_USER manquant}
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD:?NC_DB_PASSWORD manquant}
    volumes:
      - nextcloud-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [cloud]          # jamais sur edge : inaccessible depuis le relais
    mem_limit: 1g
    logging: *logging

  nextcloud-redis:
    image: redis:7-alpine
    container_name: cloud-nextcloud-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${NC_REDIS_PASSWORD:?NC_REDIS_PASSWORD manquant}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${NC_REDIS_PASSWORD:?NC_REDIS_PASSWORD manquant}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cloud]
    mem_limit: 256m
    logging: *logging

  # Taches planifiees Nextcloud. Sans lui, l'interface affiche un avertissement
  # et les jobs de fond (purge corbeille, previews, notifications) ne tournent pas.
  nextcloud-cron:
    image: nextcloud:30-apache
    container_name: cloud-nextcloud-cron
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      nextcloud: { condition: service_healthy }
    volumes:
      - nextcloud-html:/var/www/html
      - nextcloud-data:/var/www/html/data
    networks: [cloud]
    mem_limit: 512m
    logging: *logging

  # =================================================================== MinIO
  # Stockage objet S3 pour les applications : pieces jointes, modeles
  # entraines, snapshots de donnees de marche.
  minio:
    image: minio/minio:latest
    container_name: cloud-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER manquant}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant}
      MINIO_SERVER_URL: https://${MINIO_DOMAIN:?MINIO_DOMAIN manquant}
    volumes:
      - minio-data:/data
    # Console d'administration : poste fixe uniquement, jamais relayee sur le VPS.
    ports: ["127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [cloud, edge]
    mem_limit: 1g
    cpus: 1.0
    logging: *logging

  # Cree les buckets au premier demarrage, puis s'arrete.
  minio-init:
    image: minio/mc:latest
    container_name: cloud-minio-init
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER manquant}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      for b in sentinel-models sentinel-datasets sentinel-artifacts; do
        mc mb --ignore-existing local/$$b;
        mc anonymous set none local/$$b;
      done &&
      mc version enable local/sentinel-models &&
      echo 'buckets prets'
      "
    networks: [cloud]

networks:
  cloud:
    name: cloud-internal       # bases et caches, jamais joignables du relais
  edge:
    name: sentinel-edge        # partage avec la gateway WireGuard
    external: true

volumes:
  nextcloud-html:
  nextcloud-data:
  nextcloud-db:
  minio-data:
